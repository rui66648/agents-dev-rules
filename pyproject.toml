[project]
name = "agents-dev-rules"
version = "4.22.0"
description = "面向 AI 编码代理的开发流程规则仓库：规则正文、技能 SOP、确定性门禁"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "agents-dev-rules contributors" }]
keywords = ["ai", "agent", "workflow", "rules", "codegen", "guardrails"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# 门禁脚本仅需 PyYAML；其余全部使用 Python 标准库
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/rui66648/agents-dev-rules"
Issues = "https://github.com/rui66648/agents-dev-rules/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
