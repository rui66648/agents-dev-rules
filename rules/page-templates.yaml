## 组件组合规则（跨页面通用）

### 嵌套深度规则

```yaml
nesting_rules:
  max_depth: 3
  depth_by_component:
    Card: 1
    Modal: 2          # Modal 内最多再套 1 层
    Drawer: 2         # Drawer 内最多再套 1 层
    Tabs: 1           # TabPanel 视为 Card
    Grid: 0           # 容器不计深度
  enforcement: "component-validator.py 递归检查 JSX 树深度"
```

### Primary 按钮数量规则

```yaml
primary_button_rules:
  max_per_screen: 1
  exceptions:
    - scenario: "确认弹窗内的操作按钮"
      max: 2
      note: "Confirm/Cancel 各一"
    - scenario: "分页器内的跳转按钮"
      max: null
      note: "PageJump 不计入 primary"
  enforcement: "component-validator.py 统计每页面 primary variant 数量"
```

### 图标库单例规则

```yaml
icon_library_rules:
  max_per_project: 1
  allowed: [Lucide, Tabler, Phosphor, Hugeicons]
  enforcement: "component-validator.py 扫描 import 语句"
```

### 图表库单例规则

```yaml
chart_library_rules:
  max_per_page: 1
  allowed: [Recharts, ECharts, AntV-G2, AntV-G6, DataV-React]
  enforcement: "component-validator.py 扫描 import 语句"
```

