<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAQ Tooltip Button</title>
  <style>
    /* Original CSS from uiverse.io/vinodjangid07/funny-panther-79 */
    .button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background-color: #ffe53b;
      background-image: linear-gradient(147deg, #ffe53b 0%, #ff2525 74%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.151);
      position: relative;
    }
    .button svg { height: 1.5em; fill: white; }
    .button:hover svg { animation: jello-vertical 0.7s both; }
    @keyframes jello-vertical {
      0%   { transform: scale3d(1, 1, 1); }
      30%  { transform: scale3d(0.75, 1.25, 1); }
      40%  { transform: scale3d(1.25, 0.75, 1); }
      50%  { transform: scale3d(0.85, 1.15, 1); }
      65%  { transform: scale3d(1.05, 0.95, 1); }
      75%  { transform: scale3d(0.95, 1.05, 1); }
      100% { transform: scale3d(1, 1, 1); }
    }
    .tooltip {
      position: absolute;
      top: -20px;
      opacity: 0;
      background-color: #ffe53b;
      background-image: linear-gradient(147deg, #ffe53b 0%, #ff2525 74%);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition-duration: 0.2s;
      pointer-events: none;
      letter-spacing: 0.5px;
      font-size: 13px;
    }
    .tooltip::before {
      position: absolute;
      content: "";
      width: 10px;
      height: 10px;
      background-color: #ff2525;
      background-size: 1000%;
      background-position: center;
      transform: rotate(45deg);
      bottom: -15%;
      transition-duration: 0.3s;
    }
    .button:hover .tooltip {
      top: -40px;
      opacity: 1;
      transition-duration: 0.3s;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <!-- Original HTML -->
  <button class="button">
    <div class="tooltip">Need Help?</div>
    <svg viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v4m0 4h.01" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>
</body>
</html>
