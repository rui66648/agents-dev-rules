<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple CSS Spinner</title>
  <style>
    /* Original CSS from uiverse.io/Fernando-sv/quiet-zebra-41 */
    .loader {
      border: 4px solid rgba(0, 0, 0, .1);
      border-left-color: transparent;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin89345 1s linear infinite;
    }
    @keyframes spin89345 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <!-- Original HTML -->
  <div class="loader"></div>
</body>
</html>
