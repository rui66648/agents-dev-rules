# presets/creator.yaml - 创建者模式（全量 + 运行时检查）
# 参考 DeepSeek Harness Creator 模式：全量工具集 + 运行时检查，用于创建自定义 Agent
name: creator
description: 创建者模式 — 全量插件 + 安全/验证强化
version: v1.0.0

plugins:
  skills: all          # 全部技能
  rules: all           # 全部规则
  commands: all        # 全部命令
  agents: all          # 全部 Agent

# 创建者模式强化：安全与验证插件强制启用
enforced:
  - ai-safety-check
  - security-design
  - verification
  - code-review

# 运行时检查开关
runtime_checks:
  security_lint: true
  schema_gate: true
  plugin_validate: true
